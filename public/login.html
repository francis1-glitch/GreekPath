<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreekPath — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <a href="/" class="login-logo" style="text-decoration:none">
      <div class="logo-icon">⚖</div>
      <div>
        <div class="logo-title">GreekPath</div>
        <div class="logo-sub">Compliance Platform</div>
      </div>
    </a>

    <h2 class="login-heading">Welcome back</h2>
    <p class="login-subhead">Sign in to manage Greek life compliance</p>

    <div id="successBanner" style="display:none;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:11px 14px;margin-bottom:18px;font-size:.84rem;color:#86efac"></div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@psu.edu" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div id="loginError" class="error-text" style="display:none"></div>
      <button type="submit" class="btn btn-login" id="loginBtn">
        Sign In
      </button>
    </form>

    <div class="login-hint">
      <strong style="color:rgba(255,255,255,.5)">Demo Accounts</strong><br>
      Admin: <code>admin@chapterwatch.edu</code> / <code>admin123</code><br>
      Officer: <code>ifc.officer@psu.edu</code> / <code>officer123</code><br>
      Chapter: <code>sigchi.officer@psu.edu</code> / <code>chapter123</code>
    </div>

    <div style="text-align:center;margin-top:20px;display:flex;align-items:center;justify-content:space-between">
      <a href="/" style="font-size:.8rem;color:rgba(255,255,255,.35);transition:color .15s"
         onmouseover="this.style.color='rgba(255,255,255,.7)'"
         onmouseout="this.style.color='rgba(255,255,255,.35)'">
        ← Back to Home
      </a>
      <a href="/signup.html" style="font-size:.8rem;color:rgba(74,143,232,.7);transition:color .15s"
         onmouseover="this.style.color='rgba(74,143,232,1)'"
         onmouseout="this.style.color='rgba(74,143,232,.7)'">
        Create an account →
      </a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (getToken()) window.location.href = '/dashboard.html';

  // Show success message passed from signup page
  const msg = new URLSearchParams(location.search).get('msg');
  if (msg) {
    const banner = document.getElementById('successBanner');
    banner.textContent = '✓  ' + decodeURIComponent(msg);
    banner.style.display = 'block';
  }

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const data = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      }).then(r => r.json());

      if (data.token) {
        setToken(data.token);
        setUser(data.user);
        window.location.href = '/dashboard.html';
      } else {
        throw new Error(data.error || 'Login failed');
      }
    } catch (err) {
      errEl.textContent = '✕  ' + err.message;
      errEl.style.display = 'flex';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
