<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreekPath — Create Account</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-page">
  <div class="login-card" style="max-width:440px">

    <a href="/" class="login-logo" style="text-decoration:none">
      <div class="logo-icon">⚖</div>
      <div>
        <div class="logo-title">GreekPath</div>
        <div class="logo-sub">Compliance Platform</div>
      </div>
    </a>

    <h2 class="login-heading">Create an account</h2>
    <p class="login-subhead">Join your chapter's compliance workspace</p>

    <form id="signupForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="Alex Johnson" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@psu.edu" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Min. 8 characters" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="role" class="form-select" required>
          <option value="">Select your role…</option>
          <option value="chapter_officer">Chapter Officer</option>
          <option value="council_officer">Council Officer (IFC / Panhellenic / etc.)</option>
        </select>
      </div>

      <div id="signupError" class="error-text" style="display:none"></div>

      <button type="submit" class="btn btn-login" id="signupBtn">
        Create Account
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;display:flex;align-items:center;justify-content:space-between">
      <a href="/" style="font-size:.8rem;color:rgba(255,255,255,.35);transition:color .15s"
         onmouseover="this.style.color='rgba(255,255,255,.7)'"
         onmouseout="this.style.color='rgba(255,255,255,.35)'">
        ← Back to Home
      </a>
      <a href="/login.html" style="font-size:.8rem;color:rgba(74,143,232,.7);transition:color .15s"
         onmouseover="this.style.color='rgba(74,143,232,1)'"
         onmouseout="this.style.color='rgba(74,143,232,.7)'">
        Already have an account? Sign in
      </a>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (getToken()) window.location.href = '/dashboard.html';

  document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();

    const btn    = document.getElementById('signupBtn');
    const errEl  = document.getElementById('signupError');
    errEl.style.display = 'none';

    const name            = document.getElementById('name').value.trim();
    const email           = document.getElementById('email').value.trim();
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const role            = document.getElementById('role').value;

    // Client-side validation
    if (!name || !email || !password || !role) {
      errEl.textContent = '✕  All fields are required';
      errEl.style.display = 'flex';
      return;
    }
    if (password.length < 8) {
      errEl.textContent = '✕  Password must be at least 8 characters';
      errEl.style.display = 'flex';
      return;
    }
    if (password !== confirmPassword) {
      errEl.textContent = '✕  Passwords do not match';
      errEl.style.display = 'flex';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';

    try {
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Signup failed');

      // Redirect to login with success message
      window.location.href = '/login.html?msg=' + encodeURIComponent('Account created! Sign in to get started.');
    } catch (err) {
      errEl.textContent = '✕  ' + err.message;
      errEl.style.display = 'flex';
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
