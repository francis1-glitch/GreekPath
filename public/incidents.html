<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreekPath — Incidents</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Incidents</div>
        <div class="topbar-subtitle">Track, investigate, and resolve policy violations</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-danger btn-sm" id="reportIncidentBtn">+ Report Incident</button>
      </div>
    </header>

    <div class="page-content">
      <!-- Stats -->
      <div class="stats-grid" id="incidentStats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:20px">
        <div class="stat-card"><div class="stat-icon red">🔴</div><div><div class="stat-label">Open</div><div class="stat-value" id="is-open">—</div></div></div>
        <div class="stat-card"><div class="stat-icon amber">🔍</div><div><div class="stat-label">Investigating</div><div class="stat-value" id="is-investigating">—</div></div></div>
        <div class="stat-card"><div class="stat-icon green">✓</div><div><div class="stat-label">Resolved</div><div class="stat-value" id="is-resolved">—</div></div></div>
        <div class="stat-card"><div class="stat-icon red">‼</div><div><div class="stat-label">Critical</div><div class="stat-value" id="is-critical">—</div></div></div>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <input type="text" class="filter-input" id="searchInput" placeholder="Search description…">
        <select class="filter-select" id="orgFilter"><option value="">All Chapters</option></select>
        <select class="filter-select" id="typeFilter">
          <option value="">All Types</option>
          <option value="hazing">Hazing</option>
          <option value="alcohol">Alcohol</option>
          <option value="sexual_misconduct">Sexual Misconduct</option>
          <option value="other">Other</option>
        </select>
        <select class="filter-select" id="statusFilter">
          <option value="">All Statuses</option>
          <option value="open">Open</option>
          <option value="investigating">Investigating</option>
          <option value="resolved">Resolved</option>
          <option value="closed">Closed</option>
        </select>
        <select class="filter-select" id="severityFilter">
          <option value="">All Severities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>

      <!-- Incidents Table -->
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th><th>Chapter</th><th>Type</th><th>Severity</th>
                <th>Status</th><th>Description</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="incidentsTbody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)"><div class="spinner" style="border-color:var(--border);border-top-color:var(--accent);display:inline-block;vertical-align:middle;margin-right:8px"></div> Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Report Incident Modal -->
<div class="modal-backdrop" id="reportModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Report Incident</div>
      <button class="modal-close" onclick="closeModal('reportModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="reportForm">
        <div class="form-group-light">
          <label class="form-label-light">Chapter *</label>
          <select class="form-select-light" name="org_id" required id="reportOrgSel">
            <option value="">Select chapter…</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group-light">
            <label class="form-label-light">Type *</label>
            <select class="form-select-light" name="type" required>
              <option value="">Select…</option>
              <option value="hazing">Hazing</option>
              <option value="alcohol">Alcohol</option>
              <option value="sexual_misconduct">Sexual Misconduct</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Severity *</label>
            <select class="form-select-light" name="severity" required>
              <option value="">Select…</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>
        <div class="form-group-light">
          <label class="form-label-light">Description *</label>
          <textarea class="form-textarea-light" name="description" required placeholder="Detailed incident description…" style="min-height:110px"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('reportModal')">Cancel</button>
      <button class="btn btn-danger" id="saveReportBtn">Report Incident</button>
    </div>
  </div>
</div>

<!-- Edit Incident Modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal" style="max-width:680px">
    <div class="modal-header">
      <div class="modal-title" id="editModalTitle">Update Incident</div>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="modal-body" style="padding:0">
      <!-- Sub-tabs -->
      <div class="tab-bar" style="border-radius:0;border-bottom:1px solid var(--border);padding:0 20px">
        <button class="tab-btn active" id="etabDetails"  onclick="switchEditTab('details')">Details</button>
        <button class="tab-btn"        id="etabTimeline" onclick="switchEditTab('timeline')">Timeline</button>
        <button class="tab-btn"        id="etabSanctions" onclick="switchEditTab('sanctions')">Sanctions</button>
      </div>

      <!-- Details tab -->
      <div id="editTabDetails" style="padding:20px">
        <form id="editForm">
          <input type="hidden" name="id">
          <div class="form-row">
            <div class="form-group-light">
              <label class="form-label-light">Type</label>
              <select class="form-select-light" name="type">
                <option value="hazing">Hazing</option>
                <option value="alcohol">Alcohol</option>
                <option value="sexual_misconduct">Sexual Misconduct</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="form-group-light">
              <label class="form-label-light">Severity</label>
              <select class="form-select-light" name="severity">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group-light">
              <label class="form-label-light">Status</label>
              <select class="form-select-light" name="status">
                <option value="open">Open</option>
                <option value="investigating">Investigating</option>
                <option value="resolved">Resolved</option>
                <option value="closed">Closed</option>
              </select>
            </div>
            <div class="form-group-light">
              <label class="form-label-light">Resolved Date</label>
              <input type="date" class="form-input-light" name="resolved_date">
            </div>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Description</label>
            <textarea class="form-textarea-light" name="description" style="min-height:80px"></textarea>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Resolution / Notes</label>
            <textarea class="form-textarea-light" name="resolution" style="min-height:80px" placeholder="Describe the resolution or current investigation status…"></textarea>
          </div>
        </form>
      </div>

      <!-- Timeline tab -->
      <div id="editTabTimeline" style="display:none;padding:20px">
        <div id="timelineList" style="margin-bottom:16px"></div>
        <div style="border-top:1px solid var(--border);padding-top:16px">
          <div style="font-weight:600;font-size:.875rem;margin-bottom:10px">Add Timeline Entry</div>
          <div class="form-group-light">
            <label class="form-label-light">Action Taken *</label>
            <input type="text" class="form-input-light" id="tlAction" placeholder="e.g. Investigation meeting held, Evidence collected…">
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Notes</label>
            <textarea class="form-textarea-light" id="tlNotes" placeholder="Additional details…" style="min-height:70px"></textarea>
          </div>
          <button class="btn btn-primary btn-sm" onclick="addTimelineEntry()">+ Add Entry</button>
        </div>
      </div>

      <!-- Sanctions tab -->
      <div id="editTabSanctions" style="display:none;padding:20px">
        <div id="sanctionsList" style="margin-bottom:16px"></div>
        <div style="border-top:1px solid var(--border);padding-top:16px" id="addSanctionSection">
          <div style="font-weight:600;font-size:.875rem;margin-bottom:10px">Add Sanction</div>
          <div class="form-row">
            <div class="form-group-light">
              <label class="form-label-light">Type *</label>
              <select class="form-select-light" id="sancType">
                <option value="warning">Warning</option>
                <option value="probation">Probation</option>
                <option value="suspension">Suspension</option>
                <option value="revocation">Revocation</option>
              </select>
            </div>
            <div class="form-group-light">
              <label class="form-label-light">Start Date *</label>
              <input type="date" class="form-input-light" id="sancStart">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group-light">
              <label class="form-label-light">End Date</label>
              <input type="date" class="form-input-light" id="sancEnd">
            </div>
            <div class="form-group-light">
              <label class="form-label-light">Status</label>
              <select class="form-select-light" id="sancStatus">
                <option value="active">Active</option>
                <option value="completed">Completed</option>
                <option value="lifted">Lifted</option>
              </select>
            </div>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Conditions</label>
            <textarea class="form-textarea-light" id="sancConditions" placeholder="Any conditions or requirements…" style="min-height:60px"></textarea>
          </div>
          <input type="hidden" id="sancOrgId">
          <button class="btn btn-primary btn-sm" onclick="addSanction()">+ Add Sanction</button>
        </div>
      </div>
    </div>
    <div class="modal-footer" id="editModalFooter">
      <button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/incidents.js"></script>
</body>
</html>
