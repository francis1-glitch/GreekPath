<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChapterWatch — Incidents</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Incidents</div>
        <div class="topbar-subtitle">Track and manage policy violations</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-danger btn-sm" id="reportIncidentBtn">+ Report Incident</button>
      </div>
    </header>

    <div class="page-content">
      <!-- Stats -->
      <div class="stats-grid" id="incidentStats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:24px">
        <div class="stat-card"><div class="stat-icon red">🔴</div><div><div class="stat-label">Open</div><div class="stat-value" id="is-open">—</div></div></div>
        <div class="stat-card"><div class="stat-icon amber">🔍</div><div><div class="stat-label">Investigating</div><div class="stat-value" id="is-investigating">—</div></div></div>
        <div class="stat-card"><div class="stat-icon green">✓</div><div><div class="stat-label">Resolved</div><div class="stat-value" id="is-resolved">—</div></div></div>
        <div class="stat-card"><div class="stat-icon red">‼</div><div><div class="stat-label">Critical</div><div class="stat-value" id="is-critical">—</div></div></div>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <input type="text" class="filter-input" id="searchInput" placeholder="Search description…">
        <select class="filter-select" id="orgFilter">
          <option value="">All Chapters</option>
        </select>
        <select class="filter-select" id="typeFilter">
          <option value="">All Types</option>
          <option value="hazing">Hazing</option>
          <option value="alcohol">Alcohol</option>
          <option value="sexual_misconduct">Sexual Misconduct</option>
          <option value="other">Other</option>
        </select>
        <select class="filter-select" id="statusFilter">
          <option value="">All Statuses</option>
          <option value="open">Open</option>
          <option value="investigating">Investigating</option>
          <option value="resolved">Resolved</option>
          <option value="closed">Closed</option>
        </select>
        <select class="filter-select" id="severityFilter">
          <option value="">All Severities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table id="incidentsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Chapter</th>
                <th>Type</th>
                <th>Severity</th>
                <th>Status</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="incidentsTbody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)"><div class="spinner" style="border-color:var(--border);border-top-color:var(--accent);display:inline-block;vertical-align:middle;margin-right:8px"></div> Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Report Incident Modal -->
<div class="modal-backdrop" id="reportModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Report Incident</div>
      <button class="modal-close" onclick="closeModal('reportModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="reportForm">
        <div class="form-group-light">
          <label class="form-label-light">Chapter *</label>
          <select class="form-select-light" name="org_id" required id="reportOrgSel">
            <option value="">Select chapter…</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group-light">
            <label class="form-label-light">Type *</label>
            <select class="form-select-light" name="type" required>
              <option value="">Select…</option>
              <option value="hazing">Hazing</option>
              <option value="alcohol">Alcohol</option>
              <option value="sexual_misconduct">Sexual Misconduct</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Severity *</label>
            <select class="form-select-light" name="severity" required>
              <option value="">Select…</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>
        <div class="form-group-light">
          <label class="form-label-light">Description *</label>
          <textarea class="form-textarea-light" name="description" required placeholder="Detailed incident description…" style="min-height:110px"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('reportModal')">Cancel</button>
      <button class="btn btn-danger" id="saveReportBtn">Report Incident</button>
    </div>
  </div>
</div>

<!-- Edit Incident Modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Update Incident</div>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="editForm">
        <input type="hidden" name="id">
        <div class="form-row">
          <div class="form-group-light">
            <label class="form-label-light">Type</label>
            <select class="form-select-light" name="type">
              <option value="hazing">Hazing</option>
              <option value="alcohol">Alcohol</option>
              <option value="sexual_misconduct">Sexual Misconduct</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Severity</label>
            <select class="form-select-light" name="severity">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group-light">
            <label class="form-label-light">Status</label>
            <select class="form-select-light" name="status">
              <option value="open">Open</option>
              <option value="investigating">Investigating</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Resolved Date</label>
            <input type="date" class="form-input-light" name="resolved_date">
          </div>
        </div>
        <div class="form-group-light">
          <label class="form-label-light">Description</label>
          <textarea class="form-textarea-light" name="description" style="min-height:90px"></textarea>
        </div>
        <div class="form-group-light">
          <label class="form-label-light">Resolution / Notes</label>
          <textarea class="form-textarea-light" name="resolution" style="min-height:90px" placeholder="Describe the resolution or current investigation status…"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/incidents.js"></script>
</body>
</html>
