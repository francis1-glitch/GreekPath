<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreekPath — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #060e1f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    a { text-decoration: none; color: inherit; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 56px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: #4a8fe8;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.3px;
    }

    .code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
      background: linear-gradient(90deg, #4a8fe8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .heading {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      color: #fff;
      letter-spacing: -.03em;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 1rem;
      color: rgba(255,255,255,.5);
      line-height: 1.6;
      max-width: 400px;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 9px;
      font-size: .95rem;
      font-weight: 700;
      font-family: inherit;
      background: #4a8fe8;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background .15s, transform .1s;
      box-shadow: 0 4px 16px rgba(74,143,232,.35);
    }
    .btn-primary:hover { background: #5fa3f7; transform: translateY(-1px); }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 9px;
      font-size: .95rem;
      font-weight: 600;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.13);
      color: rgba(255,255,255,.8);
      cursor: pointer;
      transition: background .15s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,.12); color: #fff; }
  </style>
</head>
<body>

  <a href="/" class="brand">
    <div class="brand-icon">⚖</div>
    <span class="brand-name">GreekPath</span>
  </a>

  <div class="code">404</div>
  <div class="heading">Page not found</div>
  <p class="sub">The page you're looking for doesn't exist or may have been moved.</p>

  <div class="actions">
    <a href="/" class="btn-primary">
      ← Back to Home
    </a>
    <a href="/login.html" class="btn-ghost">
      Go to Login
    </a>
  </div>

</body>
</html>
