<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChapterWatch — Events</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <div class="topbar-title">Events</div>
        <div class="topbar-subtitle">Event approval workflow</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" id="registerEventBtn">+ Register Event</button>
      </div>
    </header>

    <div class="page-content">
      <!-- Stats -->
      <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:24px">
        <div class="stat-card"><div class="stat-icon amber">⏳</div><div><div class="stat-label">Pending Review</div><div class="stat-value" id="es-pending">—</div></div></div>
        <div class="stat-card"><div class="stat-icon green">✓</div><div><div class="stat-label">Approved</div><div class="stat-value" id="es-approved">—</div></div></div>
        <div class="stat-card"><div class="stat-icon red">✕</div><div><div class="stat-label">Denied</div><div class="stat-value" id="es-denied">—</div></div></div>
        <div class="stat-card"><div class="stat-icon amber">🍺</div><div><div class="stat-label">Alcohol Present</div><div class="stat-value" id="es-alcohol">—</div></div></div>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <input type="text" class="filter-input" id="searchInput" placeholder="Search events…">
        <select class="filter-select" id="orgFilter">
          <option value="">All Chapters</option>
        </select>
        <select class="filter-select" id="statusFilter">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="denied">Denied</option>
        </select>
        <select class="filter-select" id="alcoholFilter">
          <option value="">Any</option>
          <option value="1">Alcohol Present</option>
          <option value="0">No Alcohol</option>
        </select>
      </div>

      <!-- Pending review section (for admins/officers) -->
      <div id="pendingSection" style="display:none;margin-bottom:24px">
        <div class="section-header">
          <div>
            <div class="section-title" style="color:var(--warning)">⏳ Awaiting Review</div>
            <div class="section-subtitle">These events need approval before they proceed</div>
          </div>
        </div>
        <div id="pendingCards"></div>
      </div>

      <!-- All Events Table -->
      <div class="section-header">
        <div class="section-title">All Events</div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Event</th>
                <th>Chapter</th>
                <th>Venue</th>
                <th>Attendance</th>
                <th>Alcohol</th>
                <th>Status</th>
                <th>Reviewed By</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="eventsTbody">
              <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)"><div class="spinner" style="border-color:var(--border);border-top-color:var(--accent);display:inline-block;vertical-align:middle;margin-right:8px"></div> Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Register Event Modal -->
<div class="modal-backdrop" id="registerModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Register New Event</div>
      <button class="modal-close" onclick="closeModal('registerModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="registerForm">
        <div class="form-group-light">
          <label class="form-label-light">Chapter *</label>
          <select class="form-select-light" name="org_id" required id="registerOrgSel">
            <option value="">Select chapter…</option>
          </select>
        </div>
        <div class="form-group-light">
          <label class="form-label-light">Event Name *</label>
          <input type="text" class="form-input-light" name="name" required placeholder="Spring Formal">
        </div>
        <div class="form-row">
          <div class="form-group-light">
            <label class="form-label-light">Date & Time *</label>
            <input type="datetime-local" class="form-input-light" name="date" required>
          </div>
          <div class="form-group-light">
            <label class="form-label-light">Expected Attendance</label>
            <input type="number" class="form-input-light" name="expected_attendance" min="1" placeholder="100">
          </div>
        </div>
        <div class="form-group-light">
          <label class="form-label-light">Venue</label>
          <input type="text" class="form-input-light" name="venue" placeholder="The Penn Stater Conference Center">
        </div>
        <div class="form-group-light">
          <label class="form-label-light">Security Plan</label>
          <textarea class="form-textarea-light" name="security_plan" placeholder="Describe security arrangements, ID checking, staffing…"></textarea>
        </div>
        <div class="form-group-light">
          <label class="form-label-light" style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" name="alcohol_present" value="1" style="width:16px;height:16px">
            Alcohol will be present at this event
          </label>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('registerModal')">Cancel</button>
      <button class="btn btn-primary" id="saveRegisterBtn">Submit for Approval</button>
    </div>
  </div>
</div>

<!-- Review Modal -->
<div class="modal-backdrop" id="reviewModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="reviewModalTitle">Review Event</div>
      <button class="modal-close" onclick="closeModal('reviewModal')">✕</button>
    </div>
    <div class="modal-body">
      <div id="reviewEventDetails" style="background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:16px;font-size:.85rem;line-height:1.8"></div>
      <div class="form-group-light">
        <label class="form-label-light">Decision</label>
        <select class="form-select-light" id="reviewDecision">
          <option value="approved">Approve</option>
          <option value="denied">Deny</option>
          <option value="pending">Return to Pending</option>
        </select>
      </div>
      <div class="form-group-light">
        <label class="form-label-light">Notes / Conditions</label>
        <textarea class="form-textarea-light" id="reviewNotes" placeholder="Any conditions, requirements, or reason for denial…"></textarea>
      </div>
      <input type="hidden" id="reviewEventId">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('reviewModal')">Cancel</button>
      <button class="btn btn-primary" id="saveReviewBtn">Submit Decision</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/events.js"></script>
</body>
</html>
